<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYPRUS AI</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
}

header{
    background:#1b1b1b;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

#chat{
    height:70vh;
    overflow-y:auto;
    padding:20px;
}

.user{
    color:#66ccff;
    margin-bottom:20px;
}

.ai{
    color:#66ff99;
    margin-bottom:20px;
}

footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#222;
    padding:15px;
}

#message{
    width:80%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
}

button{
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#4CAF50;
    color:white;
}

</style>

</head>

<body>

<header>
🇨🇾 CYPRUS AI
</header>

<div id="chat"></div>

<footer>

<input
id="message"
type="text"
placeholder="Talk to Cyprus..."
onkeydown="if(event.key==='Enter') send();">

<button onclick="send()">Send</button>

</footer>

<script>

async function send(){

    let input=document.getElementById("message");

    let message=input.value.trim();

    if(message===""){
        return;
    }

    let chat=document.getElementById("chat");

    chat.innerHTML +=
    "<div class='user'><b>You:</b><br>"+message+"</div>";

    input.value="";

    chat.scrollTop=chat.scrollHeight;

    let response=await fetch("/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message
        })

    });

    let data=await response.json();

    chat.innerHTML +=
    "<div class='ai'><b>Cyprus:</b><br>"+data.reply+"</div>";

    chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
